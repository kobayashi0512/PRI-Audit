<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1065" viewBox="0 0 1800 1065"><rect width="1800" height="1065" fill="#FCFCF9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26372F}.t{font-size:40px;font-weight:700}.s{font-size:21px;fill:#687970}.p{font-size:26px;font-weight:700;fill:#176241}.l{font-size:19px;fill:#687970}.n{font-size:22px;font-weight:700;fill:#176241}.r{fill:#B85C4B;font-weight:700}</style>
<text x="70" y="70" class="t">Simulation checks for the paired-gain interpretation</text><text x="70" y="106" class="s">Method validation only: simulated scenarios do not report biological findings.</text><line x1="70" y1="132" x2="1730" y2="132" stroke="#176241" stroke-width="2"/>
<text x="90" y="194" class="p">A  Null increment</text><path d="M180 435H735M180 245V435" stroke="#B9C9BC" stroke-width="2" fill="none"/><path d="M180 425H735" stroke="#B85C4B" stroke-width="2" stroke-dasharray="8 7"/><text x="730" y="415" text-anchor="end" class="s r">0.05 reference</text><text x="295" y="390" text-anchor="middle" class="n">0.000</text><text x="455" y="390" text-anchor="middle" class="n">0.000</text><text x="615" y="390" text-anchor="middle" class="n">0.000</text><text x="295" y="467" text-anchor="middle" class="l">n=12</text><text x="455" y="467" text-anchor="middle" class="l">n=24</text><text x="615" y="467" text-anchor="middle" class="l">n=48</text><text x="458" y="500" text-anchor="middle" class="s">No positive declarations in 400 repeats per setting</text>
<text x="950" y="194" class="p">B  Coordinate-associated increment</text><path d="M1040 435H1660M1040 245V435" stroke="#B9C9BC" stroke-width="2" fill="none"/><rect x="1111" y="292" width="108" height="143" fill="#93A993" stroke="#176241" stroke-width="2"/><rect x="1296" y="263" width="108" height="172" fill="#93A993" stroke="#176241" stroke-width="2"/><rect x="1481" y="282" width="108" height="153" fill="#93A993" stroke="#176241" stroke-width="2"/><text x="1165" y="278" text-anchor="middle" class="n">0.755</text><text x="1350" y="250" text-anchor="middle" class="n">0.903</text><text x="1535" y="269" text-anchor="middle" class="n">0.808</text><text x="1165" y="467" text-anchor="middle" class="l">n=12</text><text x="1350" y="467" text-anchor="middle" class="l">n=24</text><text x="1535" y="467" text-anchor="middle" class="l">n=48</text>
<text x="90" y="590" class="p">C  Source overlap</text><path d="M180 840H735M180 620V840" stroke="#B9C9BC" stroke-width="2" fill="none"/><rect x="211" y="728" width="108" height="112" fill="#DCE8DF" stroke="#176241" stroke-width="2"/><rect x="371" y="726" width="108" height="114" fill="#DCE8DF" stroke="#176241" stroke-width="2"/><rect x="531" y="728" width="108" height="112" fill="#DCE8DF" stroke="#176241" stroke-width="2"/><rect x="281" y="620" width="108" height="220" fill="#FFF8F1" stroke="#B85C4B" stroke-width="2"/><rect x="441" y="620" width="108" height="220" fill="#FFF8F1" stroke="#B85C4B" stroke-width="2"/><rect x="601" y="620" width="108" height="220" fill="#FFF8F1" stroke="#B85C4B" stroke-width="2"/><text x="265" y="870" text-anchor="middle" class="l">n=12</text><text x="425" y="870" text-anchor="middle" class="l">n=24</text><text x="585" y="870" text-anchor="middle" class="l">n=48</text><rect x="190" y="900" width="18" height="14" fill="#DCE8DF" stroke="#176241"/><text x="220" y="914" class="s">Patient-grouped prediction</text><rect x="450" y="900" width="18" height="14" fill="#FFF8F1" stroke="#B85C4B"/><text x="480" y="914" class="s">Random-measurement interpolation</text><text x="458" y="950" text-anchor="middle" class="s r">Random splits place each test measurement in a source seen during training.</text>
<text x="950" y="590" class="p">D  Reference weakening (simulation)</text><path d="M1040 840H1660M1040 620V840" stroke="#B9C9BC" stroke-width="2" fill="none"/><path d="M1040 824H1660" stroke="#B85C4B" stroke-width="2" stroke-dasharray="8 7"/><path d="M1165 840L1350 840L1535 840" fill="none" stroke="#176241" stroke-width="3"/><circle cx="1165" cy="840" r="7" fill="#176241"/><circle cx="1350" cy="840" r="7" fill="#176241"/><circle cx="1535" cy="840" r="7" fill="#176241"/><path d="M1165 696L1350 689L1535 686" fill="none" stroke="#B85C4B" stroke-width="3" stroke-dasharray="9 6"/><path d="M1165 687l10 10-10 10-10-10zM1350 680l10 10-10 10-10-10zM1535 677l10 10-10 10-10-10z" fill="#B85C4B"/><text x="1165" y="675" text-anchor="middle" class="r">+0.459</text><text x="1350" y="668" text-anchor="middle" class="r">+0.481</text><text x="1535" y="665" text-anchor="middle" class="r">+0.492</text><text x="1165" y="870" text-anchor="middle" class="l">n=12</text><text x="1350" y="870" text-anchor="middle" class="l">n=24</text><text x="1535" y="870" text-anchor="middle" class="l">n=48</text><text x="1350" y="950" text-anchor="middle" class="s r">Weakening a comparator can manufacture an apparent gain.</text>
<text x="70" y="1025" class="s">Each panel tests an evaluation-property scenario; n denotes independent patients. These simulations do not estimate effects in psoriasis.</text></svg>